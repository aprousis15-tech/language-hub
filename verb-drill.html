const PERSONS = DATA.persons.map(([gr,en])=>({gr,en}));
const VERBS = DATA.verbs; // {en, irr, pres/na/fut/aor: [[greek,translit] ×6]}
const FORMS = [
  { key:"pres", label:"Present",          sub:"continuous",      color:"text-sky-700" },
  { key:"na",   label:"One-time present", sub:"να + perfective", color:"text-emerald-700" },
  { key:"aor",  label:"Past",             sub:"aorist",          color:"text-rose-700" },
];
const FORM_BY_KEY = Object.fromEntries(FORMS.map(f=>[f.key,f]));
const FKEYS = ["pres","na","aor"];
const GRID_NOTE = "Present = ongoing/habitual · One-time (να) = a single whole action · Past (aorist) = one completed past action.";

// flat pool of every cell for distractor search
const POOL = [];
VERBS.forEach((v,vi)=> FKEYS.forEach(k=> v[k].forEach((pair,pi)=>
  POOL.push({ vi, k, pi, gr:pair[0], tr:pair[1] }) )));

const shuffle=(a)=>{const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;};
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];}

function buildOptions(cell){
  const correct = POOL.find(p=>p.vi===cell.vi && p.k===cell.k && p.pi===cell.pi);
  const byNear=(arr)=>arr.slice().sort((a,b)=>lev(a.gr,correct.gr)-lev(b.gr,correct.gr));
  const sameVerb  = byNear(POOL.filter(p=>p.vi===correct.vi && !(p.k===correct.k&&p.pi===correct.pi) && p.gr!==correct.gr));
  const sameCell  = byNear(POOL.filter(p=>p.vi!==correct.vi && p.k===correct.k && p.pi===correct.pi && p.gr!==correct.gr));
  // 2 other forms of the SAME verb (other tense/person) + 1 same-cell other verb
  let picks=[...sameVerb.slice(0,2)];
  if(sameCell[0]) picks.push(sameCell[0]);
  const seen=new Set([correct.gr, ...picks.map(p=>p.gr)]);
  const opts=[correct,...picks];
  if(opts.length<4){ for(const p of byNear(POOL)){ if(!seen.has(p.gr)){seen.add(p.gr);opts.push(p);if(opts.length===4)break;} } }
  return shuffle(opts.slice(0,4)).map(o=>({...o,correct:o.gr===correct.gr}));
}

function filteredCells(verbSet, tense){
  return POOL.filter(p=>{
    if(verbSet==="irr" && !VERBS[p.vi].irr) return false;
    if(verbSet==="reg" && VERBS[p.vi].irr) return false;
    if(tense!=="all" && p.k!==tense) return false;
    return true;
  });
}
const ROUND=30;
function buildDeck(verbSet,tense){
  const cells=shuffle(filteredCells(verbSet,tense));
  return cells.slice(0,ROUND).map((c,i)=>({...c,id:`${c.vi}-${c.k}-${c.pi}-${i}`}));
}

// Greek text-to-speech via the browser (uses a Greek voice if installed)
function speak(text){
  try{
    if(typeof window==="undefined" || !window.speechSynthesis) return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang="el-GR"; u.rate=0.9;
    const gv=window.speechSynthesis.getVoices().find(v=>(v.lang||"").toLowerCase().startsWith("el"));
    if(gv) u.voice=gv;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

    </div>
  );
}

function GreekVerbDrill(){
  const [verbSet,setVerbSet]=useState("all");
  const [tense,setTense]=useState("all");
  const [deck,setDeck]=useState(()=>buildDeck("all","all"));
  const [pos,setPos]=useState(0);
  const [showTr,setShowTr]=useState(true);
  const [stats,setStats]=useState({right:0,wrong:0});
  const [missed,setMissed]=useState([]);
  const [picked,setPicked]=useState(null);
  const [showGrid,setShowGrid]=useState(false);

  const card=deck[pos];
  const options=useMemo(()=>card?buildOptions(card):[],[card && card.id]);

  const reset=useCallback((vs,tn)=>{ setDeck(buildDeck(vs,tn)); setPos(0); setStats({right:0,wrong:0}); setMissed([]); setPicked(null); setShowGrid(false); },[]);
  const chVerb=(vs)=>{ setVerbSet(vs); reset(vs,tense); };
  const chTense=(tn)=>{ setTense(tn); reset(verbSet,tn); };

  const answer=useCallback((opt)=>{
    if(picked) return;
    setPicked(opt.gr);
    setShowGrid(true);
    const got=opt.correct;
    setStats(s=>({right:s.right+(got?1:0),wrong:s.wrong+(got?0:1)}));
    if(!got){
      setMissed(m=>m.includes(card.vi)?m:[...m,card.vi]);
      setDeck(d=>{const c=[...d];c.splice(Math.min(pos+4,c.length),0,{...card,id:card.id+"-r"});return c;});
    }
  },[picked,card,pos]);
  const next=useCallback(()=>{ setPicked(null); setShowGrid(false); setPos(p=>p+1); },[]);

  if(!card || pos>=deck.length){
    const done=stats.right+stats.wrong, acc=done?Math.round(stats.right/done*100):0;
    const names=[...new Set(missed)].map(vi=>VERBS[vi].en);
    return (
      <div className="min-h-screen bg-stone-50 flex items-center justify-center p-6">
        <div className="w-full max-w-md bg-white rounded-2xl shadow-sm border border-stone-200 p-8 text-center">
          <div className="text-5xl mb-3">🎯</div>
          <h1 className="text-2xl font-semibold text-stone-800 mb-1">Round complete</h1>
          <p className="text-stone-500 mb-6">{stats.right} correct · {stats.wrong} slips · {acc}%</p>
          {names.length>0 && (
            <div className="text-left bg-rose-50 border border-rose-100 rounded-xl p-4 mb-6">
              <p className="text-sm font-medium text-rose-800 mb-1">Verbs to revisit:</p>
              <p className="text-sm text-rose-700">{names.join(" · ")}</p>
            </div>
          )}
          <button onClick={()=>reset(verbSet,tense)} className="w-full bg-emerald-700 text-white font-medium py-3 rounded-xl active:bg-emerald-800">New round</button>
        </div>
      </div>
    );
  }

  const f=FORM_BY_KEY[card.k], v=VERBS[card.vi], per=PERSONS[card.pi];
  return (
    <div className="min-h-screen bg-stone-50 flex flex-col p-4 select-none">
      <div className="w-full max-w-md mx-auto">
        <div className="flex gap-1.5 mb-1.5">
          {[["all","All"],["irr","Irregular"],["reg","Regular"]].map(([m,l])=>(
            <button key={m} onClick={()=>chVerb(m)} className={`flex-1 py-1.5 rounded-lg text-xs font-semibold ${verbSet===m?"bg-stone-800 text-white":"bg-white text-stone-500 border border-stone-200"}`}>{l}</button>
          ))}
        </div>
        <div className="flex gap-1.5 mb-3">
          {[["all","All tenses"],["pres","Present"],["na","One-time"],["aor","Past"]].map(([m,l])=>(
            <button key={m} onClick={()=>chTense(m)} className={`flex-1 py-1.5 rounded-lg text-[11px] font-semibold ${tense===m?"bg-stone-700 text-white":"bg-white text-stone-500 border border-stone-200"}`}>{l}</button>
          ))}
        </div>
        <div className="flex items-center justify-between text-xs text-stone-400 mb-1 px-1">
          <span>{pos+1} / {deck.length}</span>
          <span className="text-emerald-600 font-medium">{stats.right}✓</span>
          <button onClick={()=>setShowTr(t=>!t)} className="text-stone-400 underline">{showTr?"hide translit":"show translit"}</button>
        </div>
        <div className="h-1 bg-stone-200 rounded-full mb-4 overflow-hidden"><div className="h-full bg-emerald-500 transition-all" style={{width:`${(pos/deck.length)*100}%`}}/></div>
      </div>

      <div className="flex-1 flex items-start justify-center w-full max-w-md mx-auto">
        <div className="w-full bg-white rounded-2xl shadow-sm border border-stone-200 p-5">
          <div className="text-center mb-5">
            <p className="text-3xl font-semibold text-stone-800">{v.en}</p>
            <p className="mt-1 text-sm">
              <span className={`font-medium ${f.color}`}>{f.label}</span>
              <span className="text-stone-400"> · {per.gr} ({per.en})</span>
            </p>
            <button onClick={()=>speak(v.pres[0][0])}
              className="mt-2 inline-flex items-center gap-1 text-xs text-stone-500 border border-stone-200 rounded-full px-3 py-1 active:bg-stone-100">
              🔊 hear verb
            </button>
          </div>
          <div className="space-y-2.5">
            {options.map((o)=>{
              let cls="border-stone-200 bg-white active:bg-stone-50";
              if(picked){
                if(o.correct) cls="border-emerald-400 bg-emerald-50";
                else if(o.gr===picked) cls="border-rose-400 bg-rose-50";
                else cls="border-stone-200 bg-white opacity-50";
              }
              return (
                <div key={o.gr} className="flex items-stretch gap-2">
                  <button onClick={()=>answer(o)} disabled={!!picked} className={`flex-1 text-center rounded-xl border py-3 px-4 transition ${cls}`}>
                    <span className="text-2xl font-semibold text-stone-800">{o.gr}</span>
                    {showTr && <span className="block text-xs text-stone-400 mt-0.5">{o.tr}</span>}
                  </button>
                  <button onClick={()=>speak(o.gr)} aria-label="Pronounce" className="shrink-0 w-12 rounded-xl border border-stone-200 text-stone-500 text-lg active:bg-stone-100">🔊</button>
                </div>
              );
            })}
            <button onClick={()=>setShowGrid(g=>!g)}
              className="w-full mt-1 py-2.5 rounded-xl border border-stone-300 text-stone-600 text-sm font-medium active:bg-stone-50">
              {showGrid ? "Hide full conjugation ▲" : "Show full conjugation ▾"}
            </button>
            {showGrid && <Breakdown vi={card.vi} k={card.k} activePi={picked?card.pi:null} showTr={showTr}/>}
            {picked && (
              <button onClick={next} className="w-full mt-3 py-3 rounded-xl bg-emerald-600 text-white font-medium active:bg-emerald-700">Next</button>
            )}
          </div>
        </div>
      </div>
      <p className="text-center text-xs text-stone-300 mt-3 max-w-md mx-auto">75 verbs · 3 tenses · 6 persons · 🔊 taps speak any form (needs a Greek voice on your device). Distractors are real forms of the same verb + same-slot forms of other verbs.</p>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<GreekVerbDrill />);
</script>

    var compiled = Babel.transform(src, { presets: [['react', { runtime: 'classic' }]] }).code;
    var s = document.createElement('script');
    s.textContent = compiled;
    document.body.appendChild(s);
  })();
</script>
</body>
